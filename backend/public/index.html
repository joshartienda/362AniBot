<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniBot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class ="site-header">
    <img src="images/Anibot.png" alt="AniBot Logo" class="logo">
  </header>
  
  <div class="chat-container">
    <ul id="messages"></ul>

    <form id="chat-form">
      <input type="text" id="prompt" placeholder="Ask me anything about anime..." />
      <button id="send">Send</button>
      <!-- Hidden inputs to satisfy JS references -->
      <select id="model" style="display:none">
        <option value="gpt-4o-mini" selected>gpt-4o-mini</option>
      </select>
      <input id="temperature" type="number" value="0.7" step="0.1" style="display:none">
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
